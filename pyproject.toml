[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freightlens-ai"
version = "1.1.0"
description = "Reproducible freight document and visual verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pydantic>=2.8,<3", "pyyaml>=6,<7",
  "pillow>=10,<13", "opencv-python-headless>=4.10,<5", "reportlab>=4,<5",
  "faker>=30,<41", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "pypdfium2>=4.30,<6", "huggingface-hub>=0.26,<1", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6"]
ocr = ["paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
layout = ["transformers>=4.48,<5", "torch>=2.5,<3", "torchvision>=0.20,<1", "datasets>=3,<5", "evaluate>=0.4,<1", "seqeval>=1.2,<2", "accelerate>=1,<2"]
vision = ["ultralytics>=8.3,<9", "lap>=0.5,<1"]

[project.scripts]
freightlens = "freightlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freightlens"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools", ".venv-ci", "data", "artifacts", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = [".venv", ".venv-ci", ".tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["freightlens"]
